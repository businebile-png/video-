# Production automatique SANS Claude : une IA gratuite écrit et relit, le studio fait le reste. Par défaut,
# GitHub Models (gratuit, inclus dans GitHub : ChatGPT GPT-4.1 et d'autres IA), sans aucune clé à ajouter ;
# une clé Google AI Studio ou FreeLLMAPI peut le remplacer (secret STUDIO_LLM_API_KEY).
# Mêmes contrôles qu'avant (faits vérifiés, contrôleur de script, mention « Publicité ») ; pas de note minimum :
# la vidéo part si la relecture la juge cohérente et de bonne qualité (choix de l'utilisateur, 09/11/2026).
# La vidéo prête est déposée dans queue/<runId>.json ; la programmation Metricool la publie au créneau.
name: Production automatique (sans Claude)

on:
  schedule:
    # Relève : Claude produit d'abord (5:47 et 14:47) ; une heure plus tard, l'IA gratuite ne produit que si
    # aucune vidéo n'est prête ni en préparation par Claude pour le créneau (quota de Claude épuisé, échec).
    - cron: '47 5 * * *'   # 6:47 à Paris (heure d'hiver) → vidéo de 10:00
    - cron: '47 14 * * *'  # 15:47 à Paris (heure d'hiver) → vidéo de 20:00
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: production-auto
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      STUDIO_LLM_API_KEY: ${{ secrets.STUDIO_LLM_API_KEY || github.token }}
      STUDIO_LLM_BASE_URL: ${{ vars.STUDIO_LLM_BASE_URL || (secrets.STUDIO_LLM_API_KEY && 'https://generativelanguage.googleapis.com/v1beta/openai' || 'https://models.github.ai/inference,https://text.pollinations.ai/openai') }}
      STUDIO_LLM_MODEL: ${{ vars.STUDIO_LLM_MODEL || (secrets.STUDIO_LLM_API_KEY && 'gemini-2.5-flash' || 'openai/gpt-4.1,openai/gpt-4.1-mini,openai/gpt-4o-mini') }}
      STUDIO_LLM_VISION_MODEL: ${{ vars.STUDIO_LLM_VISION_MODEL || (secrets.STUDIO_LLM_API_KEY && 'gemini-2.5-flash' || 'openai/gpt-4.1,openai/gpt-4o,openai/gpt-4.1-mini') }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Récupérer le dépôt (branche du studio)
        uses: actions/checkout@v4
        with:
          ref: claude/serene-maxwell-pdm5wr
          fetch-depth: 20

      - name: Vérifier les secrets
        run: |
          echo "IA : $STUDIO_LLM_BASE_URL — modèles $STUDIO_LLM_MODEL"

          test -n "$PIXABAY_API_KEY" || { echo "::error::Secret PIXABAY_API_KEY manquant (voir docs/production-sans-claude.md)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Outils système (FFmpeg)
        timeout-minutes: 12
        run: |
          # Le 11/11/2026, apt a bloqué une heure : 7 minutes au plus, puis une version autonome de FFmpeg.
          if ! timeout 420 bash -c 'sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq ffmpeg'; then
            echo "::warning::apt indisponible : FFmpeg autonome"
            curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o "$RUNNER_TEMP/ffmpeg.tar.xz"
            mkdir -p "$HOME/ffmpeg" && tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$HOME/ffmpeg" --strip-components=1
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          fi

      - name: Cache de la voix « Claire » (environnements Python et modèles)
        uses: actions/cache@v4
        with:
          path: |
            .venv-voice
            .venv-chatterbox
            models
            ~/.cache/huggingface
            ~/.local/share/uv
          key: voix-${{ runner.os }}-${{ hashFiles('scripts/setup-voice.sh', 'scripts/fetch_voice_models.py') }}

      - name: Cache des recherches de séquences
        uses: actions/cache@v4
        with:
          path: .cache/pixabay
          key: pixabay-${{ github.run_id }}
          restore-keys: pixabay-

      - name: Installer le studio
        run: npm ci

      - name: Tester l'IA gratuite (arrêt immédiat si elle ne répond pas)
        run: |
          echo "Diagnostic GitHub Models (réponse brute, sans aucune clé affichée) :"
          curl -s -i -m 30 -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Dis bonjour"}],"max_tokens":5}' | head -c 1200 || true
          echo
          npm run studio -- llm:ping

      - name: Installer la voix, le navigateur et le rendu
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npx remotion browser ensure
          bash scripts/setup-voice.sh

      - name: Musique choisie par l'utilisateur (lien privé, jamais copiée dans le dépôt)
        env:
          STUDIO_MUSIC_URL: ${{ secrets.STUDIO_MUSIC_URL }}
        run: |
          if [ -n "$STUDIO_MUSIC_URL" ]; then
            curl -fsSL "$STUDIO_MUSIC_URL" -o "$RUNNER_TEMP/musique-utilisateur" && echo "STUDIO_MUSIC_FILE=$RUNNER_TEMP/musique-utilisateur" >> "$GITHUB_ENV" || echo "::warning::Musique non téléchargée : la vidéo partira sans musique."
          else
            echo "::notice::Pas de secret STUDIO_MUSIC_URL : vidéo sans musique."
          fi

      - name: Identité Git
        run: |
          git config user.name "Studio pub (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retirer les vidéos déjà passées (créneau + 30 h)
        run: |
          npm run studio -- queue:clean
          if ! git diff --cached --quiet; then git commit -q -m "Retrait des vidéos déjà publiées ou expirées (file d'attente)" && git push -q origin HEAD:claude/serene-maxwell-pdm5wr; fi

      - name: Produire la vidéo (IA gratuite, même studio)
        run: npm run studio -- auto ${{ github.event_name == 'schedule' && '--if-needed' || '' }}

      - name: Enregistrer le résultat dans le dépôt
        if: always()
        run: |
          git add queue data/history.json data/facts data/footage-usage.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Production automatique sans Claude : $(node -e "try{const r=require('./.cache/auto-result.json');console.log(r.message)}catch{console.log('journal')}")"
            git pull -q --rebase --autostash origin claude/serene-maxwell-pdm5wr && git push -q origin HEAD:claude/serene-maxwell-pdm5wr
          fi

      - name: Garder le compte rendu (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compte-rendu
          retention-days: 7
          path: |
            .cache/auto-result.json
            runs/*/script.json
            runs/*/script-lint.json
            runs/*/qc/review.json
            runs/*/qc/score.json
            runs/*/qc/contact-sheet.jpg
            runs/*/logs.jsonl
          if-no-files-found: ignore
